<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kontor Beta">
<meta name="theme-color" content="#15171A">
<title>Kontor Beta</title>
<!-- Kontor V2.3.2 -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link href="vendor/inter.css" rel="stylesheet">
<style>
/* Keine Markenfarbe: der Akzent ist neutral (hell auf dunkel, dunkel auf hell).
   Farbe gibt es NUR wo sie etwas bedeutet: pos = ueber Ziel/entspannt, info = unter Ziel,
   danger = destruktiv/Stress. --on-accent ist die Schrift auf Akzentflaechen. */
:root{--bg:#F4F2ED;--surface:#FFFFFF;--surface-2:#EFECE4;--field:#E9E7E1;
--line:rgba(21,23,26,.09);--line-strong:rgba(21,23,26,.14);
--text:rgba(21,23,26,.82);--text-strong:#15171A;--muted:rgba(21,23,26,.55);--silver:rgba(21,23,26,.50);--faint:rgba(21,23,26,.35);
--accent:#15171A;--on-accent:#F4F2ED;--accent-soft:rgba(21,23,26,.05);--accent-line:rgba(21,23,26,.08);
--pos:#54BE86;--pos-soft:rgba(84,190,134,.14);--pos-line:rgba(84,190,134,.45);
--info:#6B87A2;--info-soft:rgba(107,135,162,.16);--info-line:rgba(107,135,162,.40);--danger:#E0705C;
--ink:#15171A;--ink-70:rgba(21,23,26,.70);--ink-55:rgba(21,23,26,.55);--ink-50:rgba(21,23,26,.50);--ink-42:rgba(21,23,26,.42);--ink-35:rgba(21,23,26,.35);
--hairline:rgba(21,23,26,.09);--hairline-soft:rgba(21,23,26,.07);--border:rgba(21,23,26,.08);--fill-soft:rgba(21,23,26,.05);
--green-text:#3F8F63;--green-bg:rgba(84,190,134,.14);--blue-text:#4F6C88;--blue-bg:rgba(107,135,162,.16)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* clip statt hidden: schneidet genauso ab, macht den Body aber NICHT zum Scroll-Container.
   Mit hidden verliert jedes position:sticky darin seinen Bezug und klebt nicht (Safari 16+). */
html,body{margin:0;padding:0;max-width:100%;overflow-x:clip}
@supports not (overflow-x:clip){html,body{overflow-x:hidden}}
body{background:var(--bg);color:var(--text);font-family:"Inter",-apple-system,system-ui,sans-serif;font-size:16px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.mono{font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;min-height:100vh}
.bar{position:sticky;top:0;z-index:30;background:rgb(21,23,26);padding:calc(env(safe-area-inset-top) + 16px) 18px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.bar .logo{width:30px;height:30px;border-radius:9px;flex:none;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--on-accent);font-size:16px;letter-spacing:-.5px}
.bar h1{font-weight:700;font-size:18px;margin:0;letter-spacing:-.2px;flex:1;color:var(--text-strong)}
.bar h1 small{display:block;font-weight:500;font-size:10px;color:var(--muted);letter-spacing:1.6px;text-transform:uppercase;margin-top:3px}
.iconbtn{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.iconbtn:active{background:var(--surface)}
/* Tab-Leiste unten: daumenerreichbar auf grossen iPhones. Auf max-560 zentriert wie der Inhalt. */
/* KEIN backdrop-filter hier. Der Hintergrund ist seit Warm Paper deckend (Zeile .tabbar unten),
   der Blur waere unsichtbar – aber er zwingt WebKit, den Hintergrund pro Bild neu abzutasten.
   Das laeuft auf iOS nicht auf dem Scroll-Thread, wodurch die Leiste beim Schwung-Scrollen an
   veralteter Position gezeichnet wird und in die Bildmitte rutscht (Max, 01.08.2026). */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;margin:0 auto;max-width:560px;
  display:flex;justify-content:space-around;background:rgb(21,23,26);
  border-top:1px solid var(--line);
  padding:8px 6px calc(env(safe-area-inset-bottom) + 6px)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;
  background:none;color:var(--muted);font-family:inherit;font-size:10px;font-weight:600;
  letter-spacing:.1px;padding:4px 0;-webkit-tap-highlight-color:transparent}
.tabbar button.on{color:var(--text-strong)}
.tabbar svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.view{padding:14px 20px 24px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.empty{text-align:center;color:var(--muted);padding:70px 20px}
.empty .big{font-size:42px;margin-bottom:10px;opacity:.4}
.empty p{font-size:14px;line-height:1.6}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:12px;border:none;font-family:inherit;font-size:15px;font-weight:600;background:var(--accent);color:var(--on-accent);margin-bottom:10px}
.btn:active{filter:brightness(.92)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:600}
.btn.ghost:active{background:var(--surface)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid rgba(224,112,92,.4);font-weight:600}
.btnrow{display:flex;gap:10px}.btnrow .btn{margin-bottom:10px}
.srow{display:flex;align-items:center;justify-content:space-between;padding:14px 2px;background:transparent;border:none;border-bottom:1px solid var(--line);border-radius:0;margin-bottom:0}
.srow .nm{font-size:14px;font-weight:600;margin:0 10px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-strong)}
.srow .nm small{display:block;color:var(--faint);font-size:11px;font-weight:400}
.srow .v{font-weight:700;font-size:15px;flex:none;font-variant-numeric:tabular-nums}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;backdrop-filter:blur(3px)}
.scrim.on{display:block;animation:fadein .25s ease}
.scrim.out{animation:fadeout .2s ease forwards}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;background:var(--bg);width:auto;max-width:560px;border-radius:22px 22px 0 0;border-top:1px solid var(--line-strong);max-height:92vh;overflow-y:auto;overflow-x:hidden;padding:8px 20px calc(env(safe-area-inset-bottom) + 24px);animation:up .3s cubic-bezier(.2,.8,.2,1)}
.sheet.out{animation:down .2s ease forwards}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes down{to{transform:translateY(100%)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes fadeout{to{opacity:0}}
.grip{width:38px;height:5px;border-radius:3px;background:var(--line-strong);margin:8px auto 16px}
.sheet h3{font-weight:600;font-size:18px;margin:0 0 18px;letter-spacing:-.2px;color:var(--text-strong)}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:500}
.field .lblrow{display:flex;justify-content:space-between;align-items:baseline}
.field .lblrow button{background:none;border:none;color:var(--accent);font-family:inherit;font-size:11.5px;font-weight:600;padding:0}
.field input,.zz input{width:100%;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:var(--field);color:var(--text);font-family:inherit;font-size:16px;font-variant-numeric:tabular-nums}
.field input[type="time"],.field input[type="date"]{text-align:center}
.field input.txt{font-variant-numeric:normal}
.field input:focus,.zz input:focus{outline:none;border-color:var(--accent-line);background:var(--surface-2)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.field input:disabled{opacity:.4}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.toggles button{flex:1;min-width:52px;padding:11px 4px;border-radius:10px;border:1px solid var(--border);background:var(--field);color:var(--muted);font-family:inherit;font-size:13.5px;font-weight:600}
.toggles button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.toggles.mono button{font-variant-numeric:tabular-nums}
.toggles.wrap{flex-wrap:wrap}
.toggles.wrap button{flex:0 1 auto;min-width:0;padding:9px 12px}
.calc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin:4px 0 12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 8px}
.calc .c .l{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.calc .c .n{font-weight:700;font-size:18px;margin-top:3px;font-variant-numeric:tabular-nums}
.calc .c.full{grid-column:1/-1}
.note{font-size:12px;color:var(--faint);line-height:1.5;margin:8px 0 0}
.note b{color:var(--muted);font-weight:600}
.remind{border:1px solid var(--info-line);background:var(--info-soft);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--text);line-height:1.5;margin:0 0 14px}
details.exp{margin-top:10px}
details.exp summary{list-style:none;cursor:pointer;font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px;-webkit-tap-highlight-color:transparent}
details.exp summary::-webkit-details-marker{display:none}
details.exp summary::before{content:"+";display:inline-flex;width:20px;height:20px;border:1px solid var(--line-strong);border-radius:6px;align-items:center;justify-content:center;color:var(--accent);font-weight:700;flex:none}
details.exp[open] summary::before{content:"–"}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%) translateY(20px);background:var(--field);border:1px solid var(--accent-line);color:var(--text);padding:12px 20px;border-radius:12px;font-size:14px;z-index:80;opacity:0;transition:.3s;box-shadow:0 10px 40px rgba(0,0,0,.5);pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.divider{height:1px;background:var(--line);margin:18px 0}
.hidden{display:none!important}
/* Fuss traegt die Abstandsflaeche zur festen Tab-Leiste, damit die Version sichtbar bleibt */
.foot{text-align:center;padding:34px 20px calc(env(safe-area-inset-bottom) + 80px)}
.foot-v{font-size:11.5px;font-weight:600;color:var(--faint);letter-spacing:.2px}
.foot-v b{color:var(--accent);font-weight:700}
.cscrim{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:120;display:none;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(3px)}
.cscrim.on{display:flex;animation:fadein .25s ease}
.cscrim.out{animation:fadeout .15s ease forwards}
.cdlg{background:var(--surface);border:1px solid var(--line-strong);border-radius:16px;padding:22px;max-width:340px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:pop .25s cubic-bezier(.2,.8,.2,1)}
.cscrim.out .cdlg{animation:popout .15s ease forwards}
@keyframes pop{from{opacity:0;transform:scale(.95) translateY(8px)}}
@keyframes popout{to{opacity:0;transform:scale(.97)}}
@media (prefers-reduced-motion:reduce){.scrim,.scrim.on,.scrim.out,.sheet,.sheet.out,.cscrim.on,.cscrim.out,.cdlg,.cscrim.out .cdlg,.toast{animation-duration:0s!important;transition-duration:0s!important}}
.cdlg .cmsg{margin:0 0 18px;font-size:15px;line-height:1.5;color:var(--text)}
.crow{display:flex;gap:10px}.crow .btn{flex:1}
/* Dunkel-Modus: System-Standard (auto) UND manueller data-theme-Override. Beide Bloecke identisch halten. */
@media (prefers-color-scheme:dark){:root:not([data-theme]){--bg:#15171A;--surface:#1E2228;--surface-2:#262B31;--field:#34393F;--line:rgba(240,239,236,.10);--line-strong:rgba(240,239,236,.14);--text:rgba(240,239,236,.82);--text-strong:#F0EFEC;--muted:rgba(240,239,236,.55);--silver:rgba(240,239,236,.50);--faint:rgba(240,239,236,.35);--accent:#F0EFEC;--on-accent:#15171A;--accent-soft:rgba(240,239,236,.06);--accent-line:rgba(240,239,236,.10);--pos:#54BE86;--pos-soft:rgba(84,190,134,.16);--pos-line:rgba(84,190,134,.45);--info:#6B87A2;--info-soft:rgba(107,135,162,.18);--info-line:rgba(107,135,162,.40);--danger:#E0705C;--ink:#F0EFEC;--ink-70:rgba(240,239,236,.70);--ink-55:rgba(240,239,236,.55);--ink-50:rgba(240,239,236,.50);--ink-42:rgba(240,239,236,.42);--ink-35:rgba(240,239,236,.35);--hairline:rgba(240,239,236,.10);--hairline-soft:rgba(240,239,236,.08);--border:rgba(240,239,236,.10);--fill-soft:rgba(240,239,236,.06);--green-text:#54BE86;--green-bg:rgba(84,190,134,.16);--blue-text:#89A4BE;--blue-bg:rgba(107,135,162,.18)}}
:root[data-theme="dark"]{--bg:#15171A;--surface:#1E2228;--surface-2:#262B31;--field:#34393F;--line:rgba(240,239,236,.10);--line-strong:rgba(240,239,236,.14);--text:rgba(240,239,236,.82);--text-strong:#F0EFEC;--muted:rgba(240,239,236,.55);--silver:rgba(240,239,236,.50);--faint:rgba(240,239,236,.35);--accent:#F0EFEC;--on-accent:#15171A;--accent-soft:rgba(240,239,236,.06);--accent-line:rgba(240,239,236,.10);--pos:#54BE86;--pos-soft:rgba(84,190,134,.16);--pos-line:rgba(84,190,134,.45);--info:#6B87A2;--info-soft:rgba(107,135,162,.18);--info-line:rgba(107,135,162,.40);--danger:#E0705C;--ink:#F0EFEC;--ink-70:rgba(240,239,236,.70);--ink-55:rgba(240,239,236,.55);--ink-50:rgba(240,239,236,.50);--ink-42:rgba(240,239,236,.42);--ink-35:rgba(240,239,236,.35);--hairline:rgba(240,239,236,.10);--hairline-soft:rgba(240,239,236,.08);--border:rgba(240,239,236,.10);--fill-soft:rgba(240,239,236,.06);--green-text:#54BE86;--green-bg:rgba(84,190,134,.16);--blue-text:#89A4BE;--blue-bg:rgba(107,135,162,.18)}
/* Anleitung */
.help .hsec{border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin-bottom:14px;background:var(--surface)}
.help h4{margin:0 0 12px;font-size:15.5px;font-weight:700;color:var(--text-strong);letter-spacing:-.2px}
.help p{font-size:14px;line-height:1.75;color:var(--text);margin:0 0 12px}
.help p:last-child{margin-bottom:0}
.help b{color:var(--text-strong);font-weight:600}
.help ol{margin:0 0 12px;padding-left:22px;font-size:14px;line-height:1.9;color:var(--text)}
.help ol:last-child{margin-bottom:0}
.help li{margin-bottom:4px}
.help .tip{background:var(--field);border-radius:10px;padding:11px 13px;font-size:13px;color:var(--muted);line-height:1.65}
/* Kontor-Ergänzungen */
.btn:disabled{opacity:.35;pointer-events:none}
.mdot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.mdot.m1{background:var(--pos)}.mdot.m2{background:var(--muted)}.mdot.m3{background:var(--danger)}
.again{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--accent);font-size:15px;line-height:1;flex:none;display:flex;align-items:center;justify-content:center;position:relative}
.again::after{content:"";position:absolute;top:50%;left:50%;width:44px;height:44px;transform:translate(-50%,-50%)}
.again:active{background:var(--accent-soft)}
.openchip,.paidchip{font-size:10.5px;padding:3px 9px;border-radius:7px;font-weight:600;flex:none;font-family:inherit;line-height:1.3;cursor:pointer}
.openchip{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line)}
.paidchip{background:var(--pos-soft);color:var(--pos);border:1px solid var(--pos-line)}
.sublab{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;font-weight:500}
/* Monatstrenner: klebt unter der Kopfleiste (--barh wird nach dem Render gemessen) */
/* Onboarding: Vollbild-Karten ueber allem (auch ueber der Tab-Leiste, z 40) */
.onboard{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 28px) 24px calc(env(safe-area-inset-bottom) + 24px);overflow-y:auto}
.onboard .oin{max-width:560px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column}
.onboard .oskip{align-self:flex-end;background:none;border:none;color:var(--muted);font-family:inherit;font-size:13px;font-weight:600;padding:6px;min-height:30px}
.onboard .obody{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px}
.onboard h2{font-weight:600;font-size:26px;letter-spacing:-.3px;margin:0;color:var(--text-strong)}
.onboard p{font-size:15px;line-height:1.65;color:var(--text);margin:0}
.onboard .onote{font-size:12.5px;color:var(--faint);line-height:1.55}
.onboard .odots{display:flex;gap:7px;justify-content:center;margin:18px 0 6px}
.onboard .odots span{width:7px;height:7px;border-radius:50%;background:var(--line-strong)}
.onboard .odots span.on{background:var(--accent)}
.onboard .ochoice{display:flex;flex-direction:column;gap:10px}
.onboard .ochoice button{padding:15px 16px;border-radius:12px;border:1px solid var(--border);background:var(--field);color:var(--text);font-family:inherit;font-size:15px;font-weight:600;text-align:left}
.onboard .ochoice button.on{border-color:var(--accent-line);background:var(--accent-soft);color:var(--text-strong)}
.onboard .ochoice small{display:block;font-weight:400;font-size:12.5px;color:var(--muted);margin-top:3px}
.timer{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--border);background:var(--surface);box-shadow:0 1px 2px rgba(21,23,26,.04);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.timer .tk{font-size:12.5px;color:var(--muted);font-weight:600}
.timer .tt{font-weight:600;font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:-.5px;color:var(--pos);margin-top:2px}
.timer .tstop{flex:none;padding:11px 18px;border-radius:11px;border:none;background:var(--danger);color:#fff;font-family:inherit;font-weight:700;font-size:14px}
.timer .tstop:active{filter:brightness(.92)}
/* Beta 0.5: Kunden-Detail + Diagramme */
.kd-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.kd-back{background:none;border:none;font-family:inherit;color:var(--text-strong);font-size:16px;font-weight:700;padding:0;display:inline-flex;align-items:center;gap:6px}
.kd-edit{background:none;border:1px solid var(--border);color:var(--muted);font-family:inherit;font-size:12px;border-radius:999px;padding:6px 12px}
.kd-big{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px;line-height:1.05;margin:2px 0 8px}
.kd-trends{display:flex;flex-wrap:wrap;gap:14px;margin:0 0 12px;font-size:11px;color:var(--muted)}
.kd-trends b{font-variant-numeric:tabular-nums}
.up{color:var(--pos)}.down{color:var(--danger)}
.bart{position:relative;height:8px;background:var(--surface-2);border-radius:6px;margin-bottom:5px}
.bart-fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.bart-fill.pos{background:var(--pos)}.bart-fill.info{background:var(--info)}
.bart-ziel{position:absolute;top:-4px;bottom:-4px;width:1.5px;background:var(--accent);opacity:.55}
.kd-zlab{font-size:10px;color:var(--faint);text-align:right;margin-bottom:14px}
.kd-mood{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 15px;box-shadow:0 1px 2px rgba(21,23,26,.04)}
.kd-mood .kd-dot{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--silver);font-variant-numeric:tabular-nums}
.kd-mtrend{margin-left:auto;font-size:11px;color:var(--muted)}
.chartwrap{margin-top:2px}
.kd-legend{display:flex;gap:14px;font-size:10.5px;color:var(--muted);margin-top:8px}
.kd-legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:-1px}
.sw-pos{background:var(--pos)}.sw-info{background:var(--info)}
/* Beta 0.6: Blur-Modus */
.iconbtn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
body.blur .eur{filter:blur(0.35em);user-select:none}
/* Beta 0.7 Warm Paper: Fundament */
body{background:var(--bg);color:var(--text);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.bar{background:var(--bg);gap:12px;border-bottom:1px solid var(--hairline)}
.bar .logo{width:24px;height:24px;border-radius:7px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:700}
.bar .wm{flex:1;font-size:14px;font-weight:600;letter-spacing:.16em;color:var(--text-strong)}
.iconbtn{width:31px;height:31px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--ink-70);font-size:15px;position:relative}
/* Trefferflaeche auf 44px ohne die Optik zu vergroessern (Apple HIG) */
.iconbtn::after{content:"";position:absolute;top:50%;left:50%;width:44px;height:44px;transform:translate(-50%,-50%)}
.iconbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 1px 2px rgba(21,23,26,.04)}
.hero{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:0 1px 2px rgba(21,23,26,.04)}
.hero .lab{font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-50)}
.hero .big{font-size:42px;font-weight:400;letter-spacing:-.03em;line-height:1;margin:8px 0 14px;color:var(--text-strong)}
.hero .big small{font-size:18px;color:var(--ink-50);margin-left:4px}
.split{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--hairline-soft);gap:2px}
.split i{display:block;height:100%;border-radius:99px}
.split .g{background:var(--pos)}.split .b{background:var(--info)}
.heroleg{display:flex;justify-content:space-between;margin-top:10px;font-size:11.5px;color:var(--muted)}
.heroleg .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:1px}
.badge{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.02em;padding:3px 9px;border-radius:99px}
.badge.neutral{background:var(--fill-soft);color:var(--ink-55)}
.badge.blue{background:var(--blue-bg);color:var(--blue-text)}
.badge.green{background:var(--green-bg);color:var(--green-text)}
/* Status-Chip ist tippbar: groesser plus 44px-Trefferflaeche */
.badge.cyc{padding:8px 11px;position:relative;border:none;font-family:inherit}
.badge.cyc::after{content:"";position:absolute;inset:-9px -5px}
.tabbar{background:var(--surface);border-top:1px solid var(--hairline)}
.fab{position:fixed;right:18px;bottom:calc(72px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);border:none;border-radius:99px;padding:13px 18px;font-family:inherit;font-size:13.5px;font-weight:600;box-shadow:0 8px 22px rgba(21,23,26,.28);z-index:20}
.mgroup{padding:0 4px;display:flex;justify-content:space-between;align-items:baseline;margin:2px 0 8px}
.mgroup .m{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-50)}
.mgroup .s{font-size:11.5px;color:var(--ink-50)}
.elist{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 1px 2px rgba(21,23,26,.04);overflow:hidden;margin-bottom:14px}
.erow{display:flex;gap:12px;align-items:center;padding:14px 16px}
.erow+.erow{border-top:1px solid var(--hairline-soft)}
.erow:active{background:var(--fill-soft)}
.dchip{width:42px;flex:none;background:var(--fill-soft);border-radius:9px;text-align:center;padding:6px 0}
.dchip .d{font-size:15px;font-weight:600;line-height:1;color:var(--text-strong)}
.dchip .mo{font-size:9.5px;font-weight:500;color:var(--ink-50);letter-spacing:.05em}
.emid{flex:1;min-width:0}
.emid .t{font-size:13.5px;font-weight:500;color:var(--text-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emid .sub{font-size:11.5px;color:var(--ink-50);margin-top:2px}
.emid .badge,.emid .cyc{margin-top:6px;font-family:inherit;border:none}
.cyc{cursor:pointer}
.eamt{text-align:right;flex:none}
.eamt .b{font-size:13.5px;font-weight:500;color:var(--text-strong)}
.eamt .f{font-size:11.5px;font-weight:500;color:var(--green-text);margin-top:2px}
.eamt .r{font-size:11px;font-weight:500;color:var(--blue-text);margin-top:1px}
.timerbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:transparent;border:1px solid var(--border);border-radius:12px;padding:13px;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--ink-70)}
.view{padding-bottom:100px}
/* Beta 0.7 Teil 2: Statistik */
.yeartog{display:inline-flex;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:2px;margin-bottom:16px}
.yeartog button{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);padding:5px 12px;border-radius:8px;border:none;background:none;font-family:inherit}
.yeartog button.on{background:var(--fill-soft);color:var(--text-strong)}
.goalbadge{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--green-bg);color:var(--green-text)}
.goalziel{font-size:11.5px;color:var(--ink-50);white-space:nowrap;margin-left:8px}
.progress{height:8px;border-radius:99px;background:var(--hairline-soft);margin-top:12px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--pos);border-radius:99px}
.krow{display:grid;gap:12px;margin-bottom:12px}
.krow.c2{grid-template-columns:1fr 1fr}.krow.c3{grid-template-columns:1fr 1fr 1fr}
.kt{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:0 1px 2px rgba(21,23,26,.04);display:flex;flex-direction:column;gap:5px}
.kt .l{font-size:11px;color:var(--ink-50)}
.kt .n{font-size:20px;font-weight:500;color:var(--text-strong);font-variant-numeric:tabular-nums}
.kt .n.blue{color:var(--blue-text)}
.kt .sub{font-size:10.5px;color:var(--ink-55)}
.budget{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 1px 2px rgba(21,23,26,.04);padding:16px;margin-bottom:14px}
.budget .bh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.budget .bh h4{margin:0;font-size:13px;font-weight:600;color:var(--text-strong)}
.budget .bh span{font-size:11px;color:var(--ink-50)}
.budgetrow{display:flex;align-items:center;gap:12px}.budgetrow+.budgetrow{margin-top:12px}
.budgetrow .bl{width:74px;font-size:11.5px;color:var(--ink-55)}
.budgetrow .bt{flex:1;height:6px;background:var(--hairline-soft);border-radius:99px;overflow:hidden}
.budgetrow .bt i{display:block;height:100%;border-radius:99px}
.budgetrow .bv{width:80px;text-align:right;font-size:12.5px;font-weight:500;color:var(--text-strong);font-variant-numeric:tabular-nums}
.qcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 1px 2px rgba(21,23,26,.04);padding:15px;margin-bottom:14px}
.qcard .qh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.qcard .qh h3{margin:0;font-size:13px;font-weight:600;color:var(--text-strong)}
.qcard .qh span{font-size:10.5px;color:var(--ink-50)}
.qhint{font-size:11.5px;color:var(--ink-55);line-height:1.5;margin-top:10px;text-wrap:pretty}
.vcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 1px 2px rgba(21,23,26,.04);padding:6px 15px 12px;margin-bottom:14px}
.vrow{padding:12px 0 6px}.vrow+.vrow{border-top:1px solid var(--hairline-soft)}
.vrow .vt{display:flex;justify-content:space-between;font-size:12.5px;font-weight:500;color:var(--text-strong)}
.vrow .vt .amt{font-variant-numeric:tabular-nums}
.vrow .vb{height:3px;background:var(--hairline-soft);border-radius:2px;margin-top:7px;overflow:hidden}
.vrow .vb i{display:block;height:100%;background:var(--ink-70)}
.secttl{font-size:13px;font-weight:600;color:var(--text-strong);margin:20px 4px 10px}

/* Beta 0.7 Teil 3: Kunden-Karten */
.badge.wide{letter-spacing:.1em;padding:4px 9px}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 1px 2px rgba(21,23,26,.04);padding:18px;margin-bottom:12px;display:flex;flex-direction:column;gap:14px;cursor:pointer}
.kcard.quiet{gap:0;padding:15px 18px}
.kcard .khead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.kcard .kname{font-size:15px;font-weight:600;color:var(--text-strong)}
.kcard .ksub{font-size:11.5px;color:var(--ink-50);margin-top:3px}
.kcard .kpi{display:flex;border-top:1px solid var(--hairline);padding-top:14px}
.kcard .kpi>div{flex:1;display:flex;flex-direction:column;gap:3px}
.kcard .kpi .kl{font-size:10.5px;color:var(--ink-50)}
.kcard .kpi .kv{font-size:15px;font-weight:500;color:var(--text-strong);font-variant-numeric:tabular-nums}
.kcard .kbar{height:4px;border-radius:99px;background:var(--hairline-soft);overflow:hidden}
.kcard .kbar i{display:block;height:100%;border-radius:99px}
.kcard .kbar i.pos{background:var(--pos)}.kcard .kbar i.info{background:var(--info)}
.kcard .knote{font-size:11.5px;line-height:1.5;color:var(--ink-55);text-wrap:pretty}
.kadd{border:1px dashed var(--border);border-radius:14px;padding:16px;text-align:center;font-size:13px;font-weight:500;color:var(--ink-50);cursor:pointer}

/* Beta 0.7 Teil 4: Einstellungen + Slider */
.setttl{font-size:13px;font-weight:600;color:var(--text-strong);margin-bottom:2px}
.setcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 1px 2px rgba(21,23,26,.04);padding:16px;margin-bottom:12px;display:flex;flex-direction:column;gap:14px}
.setcard.nopad{padding:0;gap:0;overflow:hidden}
.slrow{display:flex;flex-direction:column;gap:9px}
.slrow .sllab{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--ink-55)}
.slrow .slval{font-size:14px;font-weight:500;color:var(--text-strong);font-variant-numeric:tabular-nums}
/* Regler: 44px greifbare Hoehe, Spur bleibt optisch duenn */
.slider{width:100%;height:44px;margin:-14px 0;background:transparent;-webkit-appearance:none;appearance:none}
.slider::-webkit-slider-runnable-track{height:3px;border-radius:99px;background:var(--hairline)}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-9.5px;border:none;border-radius:50%;background:var(--info)}
.slider::-moz-range-track{height:3px;border-radius:99px;background:var(--hairline)}
.slider::-moz-range-thumb{width:22px;height:22px;border:none;border-radius:50%;background:var(--info)}
.zrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:14px;border-top:1px solid var(--hairline);cursor:pointer}
.zrow .srk{font-size:13.5px;font-weight:500;color:var(--text-strong)}
.zrow .srs{font-size:11px;color:var(--ink-50);margin-top:2px}
.zrow .srv{font-size:14px;font-weight:500;color:var(--text-strong);font-variant-numeric:tabular-nums}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 16px}
.setrow.line{border-top:1px solid var(--hairline)}
.setrow.tap{cursor:pointer}
.setrow .srk{font-size:13.5px;font-weight:500;color:var(--text-strong)}
.setrow .srs{font-size:11.5px;color:var(--ink-50)}
.setrow .chev{color:var(--ink-55);font-size:16px}
.impact{background:var(--blue-bg);border-radius:10px;padding:13px 14px;display:flex;flex-direction:column;gap:4px}
.impact .imttl{font-size:11.5px;font-weight:500;color:var(--blue-text)}
.impact .imtx{font-size:12px;line-height:1.5;color:var(--ink-55)}
.privacy{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 1px 2px rgba(21,23,26,.04);padding:16px;margin-bottom:12px}
.privacy .pvtop{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.privacy .pvdot{width:8px;height:8px;border-radius:50%;background:var(--pos);flex:none}
.privacy .pvttl{font-size:13px;font-weight:600;color:var(--text-strong)}
.privacy p{margin:0;font-size:11.5px;line-height:1.5;color:var(--ink-55)}
.setnote{font-size:11px;color:var(--ink-55);line-height:1.5}
/* Wegzeit: eingeklappter Block, bleibt im Normalfall unsichtbar */
.zz{border:1px solid var(--border);border-radius:12px;padding:0 14px;margin:0 0 16px}
.zz>summary{list-style:none;cursor:pointer;padding:13px 0;font-size:12px;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;align-items:center}
.zz>summary::-webkit-details-marker{display:none}
.zz>summary .zzv{color:var(--text-strong);font-variant-numeric:tabular-nums}
.zz .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding-bottom:14px}
.zz .two .sublab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="app">
  <div class="bar"><div class="logo">K</div><div class="wm" id="barsub">KONTOR</div><button class="iconbtn" id="blurBtn" aria-label="Beträge verbergen"></button><button class="iconbtn" id="themeBtn" aria-label="Theme"></button></div>
  <div class="view" id="view"></div>
  <div class="foot">
    <div class="foot-v">Kontor <b>V2.3.2</b></div>
  </div>
</div>
<nav class="tabbar" id="tabbar">
  <button data-tab="einsaetze" class="on" aria-label="Einsätze"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2.5"/><line x1="7.5" y1="10" x2="16.5" y2="10"/><line x1="7.5" y1="12.7" x2="16.5" y2="12.7"/><line x1="7.5" y1="15.4" x2="16.5" y2="15.4"/></svg>Einsätze</button>
  <button data-tab="kunden" aria-label="Kunden"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.6 3.1-5.5 7-5.5s7 1.9 7 5.5"/></svg>Kunden</button>
  <button data-tab="stats" aria-label="Statistik"><svg viewBox="0 0 24 24"><line x1="6" y1="20" x2="6" y2="12"/><line x1="12" y1="20" x2="12" y2="5"/><line x1="18" y1="20" x2="18" y2="14"/></svg>Statistik</button>
  <button data-tab="set" aria-label="Mehr"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" style="fill:currentColor"/><circle cx="12" cy="12" r="1.6" style="fill:currentColor"/><circle cx="19" cy="12" r="1.6" style="fill:currentColor"/></svg>Mehr</button>
</nav>
<input type="file" id="backupInput" accept="application/json,.json" class="hidden">
<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div class="cscrim" id="confirmBox"><div class="cdlg"><p class="cmsg"></p><div class="crow"><button id="cNo" class="btn ghost" style="margin:0">Abbrechen</button><button id="cYes" class="btn danger" style="margin:0">Löschen</button></div></div></div>

<script>
"use strict";
/* ===== Persistenz (Fallback falls localStorage gesperrt) ===== */
const KEY="kontor_v1";
const Store={mem:{},load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return this.mem[KEY]||null}},save(o){try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){this.mem[KEY]=o}}};
let DB=Store.load()||{kunden:[],einsaetze:[],settings:{}};
DB.kunden??=[];DB.einsaetze??=[];DB.settings??={};
const S=DB.settings;
/* Migration beim Laden: einzige Stelle, durch die alle Daten müssen (localStorage wie Backup-Import).
   Normalisiert Typen, damit der restliche Code sich auf sie verlassen kann. */
const numS=(v,d)=>{const n=(v==null||v==="")?NaN:+v;return Number.isFinite(n)?n:d;};
S.mwst=numS(S.mwst,0.19);S.steuersatz=numS(S.steuersatz,0.38);S.sollStunden=numS(S.sollStunden,10);
S.splitFix=numS(S.splitFix,0.5);S.splitPersoenlich=numS(S.splitPersoenlich,0.3);S.splitSparen=numS(S.splitSparen,0.2);
S.zielStundensatz=numS(S.zielStundensatz,100);S.jahresziel=numS(S.jahresziel,40000);S.zeitbasis=["arbeit","gesamt"].includes(S.zeitbasis)?S.zeitbasis:"arbeit";S.theme=["auto","light","dark"].includes(S.theme)?S.theme:"auto";
S.defaultModus=(S.defaultModus==="stunde")?"stunde":"tag";
S.onboarded=!!S.onboarded;
S.timer=(S.timer&&typeof S.timer==="object"&&Number.isFinite(+S.timer.start)&&DB.kunden.some(k=>k.id===S.timer.kundeId))?{kundeId:S.timer.kundeId,start:+S.timer.start}:null;
DB.kunden.forEach(k=>{k.name=String(k.name??"");k.tagessatz=numS(k.tagessatz,0);k.notiz=String(k.notiz??"");k.modus=(k.modus==="stunde")?"stunde":"tag";});
DB.einsaetze.forEach(e=>{e.stimmung=[1,2,3].includes(e.stimmung)?e.stimmung:null;
  e.notiz=String(e.notiz??"");e.status=["offen","gestellt","bezahlt"].includes(e.status)?e.status:(e.abgerechnet?"bezahlt":"offen");e.abgerechnet=(e.status==="bezahlt");e.tagessatz=numS(e.tagessatz,0);e.modus=(e.modus==="stunde")?"stunde":"tag";
  e.fahrtHin=Math.max(0,numS(e.fahrtHin,0));e.fahrtZurueck=Math.max(0,numS(e.fahrtZurueck,0));
  e.vorbereitung=Math.max(0,numS(e.vorbereitung,0));e.nachbereitung=Math.max(0,numS(e.nachbereitung,0));});
if(DB.kunden.length||DB.einsaetze.length)S.onboarded=true; /* Bestandsdaten sehen nie ein Onboarding */
function persist(){Store.save(DB);}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ===== Format-Helfer ===== */
const MN=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
function fmtMonth(mk){return MN[+mk.slice(5,7)-1]+" "+mk.slice(0,4);}
function fmtDE(dt){const d=dt||new Date();return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear();}
function fmtEUR0(n){return n==null?"–":Math.round(n).toLocaleString("de-DE")+" €";}
/* Beta 0.6: Summen fuer den Blur-Modus markieren. Liefert HTML, daher NIE in esc() wickeln. */
function eur(n){return '<span class="eur">'+fmtEUR0(n)+'</span>';}
function fmtStd(h){return h==null?"–":h.toLocaleString("de-DE",{minimumFractionDigits:1,maximumFractionDigits:1});}
function fmtSatz(n){return n==null?"–":Math.round(n).toLocaleString("de-DE")+" €/Std";}
/* Warm Paper: 2-Dezimal-Betrag fuer Listen (Blur-erfasst) und Stundensatz als "€/h". */
function eur2(n){return '<span class="eur">'+(n==null?"–":n.toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2})+" €")+'</span>';}
function fmtSatzH(n){return n==null?"–":n.toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2})+" €/h";}
function fmtSatzBare(n){return n==null?"–":n.toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2});}
/* Zeitbasis-Schalter (S.zeitbasis): entscheidet an EINER Stelle, ob Anzeigen auf Arbeitszeit
   (vor Ort + Vor-/Nachbereitung) oder auf Gesamtzeit inkl. Fahrt rechnen. Honorar nie betroffen. */
function stdOf(c){return S.zeitbasis==="gesamt"?c.stundenGesamt:c.arbeitStunden;}
function satzOf(c){return S.zeitbasis==="gesamt"?c.stundensatzGesamt:c.stundensatzArbeit;}
const zbSuffix=()=>S.zeitbasis==="gesamt"?" inkl. Fahrt":"";
/* Warm Paper: Kunden-Quadrant als Streudiagramm. rows=[{kid,hon,std,satz}], avg=Ø-Satz gesamt.
   Achsen wie Cloud-Prototyp: x = Honoraranteil (8..70 %, Label passt rechts), y = Stundensatz absolut (hoher Satz oben). */
function quadrantSVG(rows,avg){
  const W=312,H=260,LABELS=6;           // hoeher + nur die 6 groessten beschriften (mobil lesbar)
  const maxFee=Math.max(...rows.map(r=>r.hon||0),1);
  const maxH=Math.max(...rows.map(r=>r.satz||0),0.0001);
  let dots="";const placed=[];
  rows.slice().sort((a,b)=>(b.hon||0)-(a.hon||0)).forEach((r,i)=>{
    const label=i<LABELS;
    const xN=(r.hon||0)/maxFee;
    const xp=8+xN*62;                     // 8..70 % Breite – wie Prototyp
    let yp=84-((r.satz||0)/maxH)*68;      // hoher Satz oben, absolute Skala – wie Prototyp
    const rad=4+xN*3;const col=(r.satz||0)>=avg?"var(--pos)":"var(--info)";
    let nm="",flip=false,x1=0,x2=0;
    if(label){
      nm=esc(kName(r.kid));
      const xPx=xp/100*W, wPx=nm.length*6.2;   // Breitenschaetzung, bewusst etwas zu gross (sichere Seite)

      x1=flip?(xPx-rad-5-wPx):(xPx-rad);

      while(placed.some(p=>Math.abs(p.y-yp)<7&&x1<p.x2&&x2>p.x1)){yp+=7;}

    <line x1="8" y1="${H/2}" x2="${W-8}" y2="${H/2}" stroke="var(--hairline)" stroke-width="1"/>

/* ===== Rechenmodul (pur, von tools/test-calc.mjs getestet) ===== */
/*[calc]*/
function hm2min(s){if(!s)return null;const m=String(s).match(/^\s*(\d{1,2}):(\d{2})\s*$/);if(!m)return null;const h=+m[1],mm=+m[2];return(h>23||mm>59)?null:h*60+mm;}
/* Zusatzzeiten werden in MINUTEN eingegeben, aber in STUNDEN gespeichert (Backup-Kompat).
   Umgerechnet wird nur an der Eingabegrenze des Sheets. */
function minToH(v){const n=+v;return Number.isFinite(n)&&n>0?n/60:0;}
function hToMin(h){const n=+h;return Number.isFinite(n)&&n>0?String(Math.round(n*60)):"";}
function calcEinsatz(e,P){
  const b=hm2min(e.beginn),x=hm2min(e.ende);
  let stunden=null;
  if(b!=null&&x!=null){let d=x-b;if(d<0)d+=1440;stunden=d/60;} /* ende < beginn = Nachtdreh über 0:00 */
  const raw=(e.tagessatz==null||e.tagessatz==="")?NaN:+e.tagessatz;
  const satz=Number.isFinite(raw)?raw:null;
  const modus=(e.modus==="stunde")?"stunde":"tag"; /* Whitelist: alles andere = tag */
  /* honorar: Pauschale (Tagessatz) ODER Stunden x Stundensatz. Feldname tagessatz bleibt
     aus Backup-Kompatibilitaet; die UI beschriftet je Modus. */
  const honorar=(satz==null)?null:(modus==="stunde"?(stunden==null?null:stunden*satz):satz);
  const stundensatz=(modus==="stunde")?satz:((stunden&&honorar!=null)?honorar/stunden:null);
  /* Zusatzzeit ist ZEIT, KEIN GELD: sie geht NIE ins honorar, sondern nur in die Bewertung.
     ZWEI STUFEN (V2.3): Vor-/Nachbereitung ist ARBEIT und zaehlt in arbeitStunden;
     Fahrt kommt erst in der Stufe "Tuer zu Tuer" (stundenGesamt) dazu. */
  const nz=v=>{const n=+v;return Number.isFinite(n)&&n>0?n:0;};
  const arbeitZusatz=nz(e.vorbereitung)+nz(e.nachbereitung);
  const fahrtStunden=nz(e.fahrtHin)+nz(e.fahrtZurueck);
  const zusatzStunden=arbeitZusatz+fahrtStunden;
  const arbeitStunden=stunden==null?null:stunden+arbeitZusatz;
  const stundenGesamt=stunden==null?null:stunden+zusatzStunden;
  const ueberstunden=arbeitStunden==null?null:arbeitStunden-P.sollStunden; /* Vor-/Nachbereitung ist Mehrarbeit, Fahrt nicht */
  const stundensatzArbeit=(arbeitStunden&&honorar!=null)?honorar/arbeitStunden:null;
  const stundensatzGesamt=(stundenGesamt&&honorar!=null)?honorar/stundenGesamt:null;
  if(honorar==null)return{stunden,stundensatz,ueberstunden,arbeitZusatz,fahrtStunden,zusatzStunden,arbeitStunden,stundenGesamt,stundensatzArbeit,stundensatzGesamt,honorar:null,rechnungsbetrag:null,ustRuecklage:null,steuerRuecklage:null,verfuegbar:null,splitFix:null,splitPersoenlich:null,splitSparen:null};
  const rechnungsbetrag=honorar*(1+P.mwst);
  const ustRuecklage=honorar*P.mwst;              /* gehört dem Finanzamt */
  const steuerRuecklage=honorar*P.steuersatz;     /* auf NETTO */
  const verfuegbar=honorar-steuerRuecklage;
  return{stunden,stundensatz,ueberstunden,arbeitZusatz,fahrtStunden,zusatzStunden,arbeitStunden,stundenGesamt,stundensatzArbeit,stundensatzGesamt,honorar,rechnungsbetrag,ustRuecklage,steuerRuecklage,verfuegbar,
    splitFix:verfuegbar*P.splitFix,splitPersoenlich:verfuegbar*P.splitPersoenlich,splitSparen:verfuegbar*P.splitSparen};
}

function years(){const s=new Set(DB.einsaetze.map(e=>(e.datum||"").slice(0,4)).filter(Boolean));const a=[...s].sort().reverse();return a.length?a:[String(new Date().getFullYear())];}

/* ===== Kunden-Detail + Diagramme (Beta 0.5): reine Helfer ===== */
function kundeStats(kid,y){
  const es=DB.einsaetze.filter(e=>e.kundeId===kid&&(e.datum||"").slice(0,4)===y);
  let hon=0,std=0,n=0;const m=[0,0,0,0];const mon={};
  es.forEach(e=>{const c=calcEinsatz(e,S);hon+=c.honorar||0;std+=stdOf(c)||0;n++;
    if([1,2,3].includes(e.stimmung))m[e.stimmung]++;
    const mk=(e.datum||"").slice(0,7);const p=mon[mk]??={paid:0,open:0};
    if(e.status==="bezahlt")p.paid+=c.honorar||0;else p.open+=c.honorar||0;});
  let offenBrutto=0;
  DB.einsaetze.filter(e=>e.kundeId===kid&&e.status!=="bezahlt").forEach(e=>{offenBrutto+=calcEinsatz(e,S).rechnungsbetrag||0;});
  const months=Object.keys(mon).sort().map(mk=>({mk,paid:mon[mk].paid,open:mon[mk].open}));
  return {n,hon,std,satz:std?hon/std:null,m,offenBrutto,months};
}
/* Horizontaler Ziel-Balken (CSS). satz null -> leerer Track. */
function barTargetHTML(satz,ziel){
  if(satz==null||!ziel)return '<div class="bart"><div class="bart-fill info" style="width:0"></div></div>';
  const scale=Math.max(satz,ziel)*1.25;
  const fw=Math.min(100,satz/scale*100),zw=Math.min(100,ziel/scale*100);

}
/* Gestapeltes Monats-Säulendiagramm (reines SVG). months=[{mk,paid,open}] (honorar netto). */
function niceNum(v){if(v<=0)return 0;const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return (f<1.5?1:f<3?2:f<7?5:10)*p;}
/* Achsen-Kurzform: 5000 -> "5k". NUR fuer Diagramm-Achsen, nie fuer Betraege im Fliesstext. */
function fmtKurz(n){if(n==null)return "–";const a=Math.abs(n);
  if(a>=1000)return (Math.round(n/100)/10).toLocaleString("de-DE")+"k";
  return Math.round(n).toLocaleString("de-DE");}
function colChartSVG(months){
  if(!months.length)return "";
  const W=312,base=140,top=20,plot=base-top,H=172;
  /* Die Achse braucht eine EIGENE Spalte links. Vorher stand das Label bei x=6 mitten im
     Diagramm und wurde von den Saeulen ueberdeckt – bei 12 Monaten lag "5.000 €" unter
     Januar und Februar (Max, 01.08.2026). */
  const padL=28;
  const max=Math.max(...months.map(m=>m.paid+m.open),1);const scale=max*1.1;
  const n=months.length,gap=8,plotW=W-6-padL;
  const bw=Math.min(40,(plotW-10-gap*(n-1))/n);
  const x0=padL+(plotW-(bw*n+gap*(n-1)))/2,step=bw+gap;
  let s=`<line x1="${padL}" y1="${base}" x2="${W-6}" y2="${base}" stroke="var(--line-strong)" stroke-width="1"/>`
    +`<text x="${padL-5}" y="${base+3}" fill="var(--faint)" font-size="8.5" text-anchor="end">0</text>`;
  const stepV=niceNum(scale/4);
  if(stepV>0)for(let v=stepV,i=0;v<=scale&&i<8;v+=stepV,i++){const gy=base-(v/scale)*plot;
    s+=`<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${W-6}" y2="${gy.toFixed(1)}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/>`
      +`<text class="eur" x="${padL-5}" y="${(gy+3).toFixed(1)}" fill="var(--faint)" font-size="8.5" text-anchor="end">${esc(fmtKurz(v))}</text>`;}
  months.forEach((m,i)=>{const x=x0+i*step;const hPaid=m.paid/scale*plot,hOpen=m.open/scale*plot;
    const yPaid=base-hPaid,yOpen=yPaid-hOpen;const lab=MN[+m.mk.slice(5,7)-1].slice(0,3);
    if(hPaid>0.5)s+=`<rect x="${x.toFixed(1)}" y="${yPaid.toFixed(1)}" width="${bw.toFixed(1)}" height="${hPaid.toFixed(1)}" rx="2.5" fill="var(--pos)"/>`;
    if(hOpen>0.5)s+=`<rect x="${x.toFixed(1)}" y="${yOpen.toFixed(1)}" width="${bw.toFixed(1)}" height="${hOpen.toFixed(1)}" rx="2.5" fill="var(--info)"/>`;
    s+=`<text x="${(x+bw/2).toFixed(1)}" y="${base+15}" fill="var(--muted)" font-size="9.5" text-anchor="middle">${esc(lab)}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Monatliche Umsatzsäulen, grün bezahlt, blau offen"><title>Umsatz pro Monat</title><desc>Gestapelte Säulen je Monat: grün bezahlt, blau offen.</desc>${s}</svg>`;
}

function renderKunden(){
  const ys=years();if(ys.length&&(!state.year||!ys.includes(state.year)))state.year=ys[0];
  const y=state.year;
  const satzLab=k=>k.modus==="stunde"?"Stundensatz":"Tagessatz";
  const subLine=(k,n)=>`${satzLab(k)} ${fmtEUR0(k.tagessatz)} · ${n} Einsätze`;
  let h="";
  if(ys.length>1)h+=`<div class="yeartog" id="yearSel">${ys.map(yy=>`<button data-y="${esc(yy)}"${yy===y?' class="on"':''}>${esc(yy)}</button>`).join("")}</div>`;
  if(!DB.kunden.length){
    view.innerHTML=h+`<div class="empty"><p>Noch keine Kunden.<br>Kunden entstehen auch direkt beim Erfassen eines Einsatzes.</p></div><div class="kadd" id="addK">＋ Kunde anlegen</div>`;
    document.getElementById("addK").onclick=()=>editKunde(null);bindYear();return;}
  const E=y?einsJahr(y):[];
  const totHon=E.reduce((a,e)=>a+(calcEinsatz(e,S).honorar||0),0);
  const totStd=E.reduce((a,e)=>a+(stdOf(calcEinsatz(e,S))||0),0);
  const jahresAvg=totStd?totHon/totStd:0;
  const rows=DB.kunden.map(k=>({k,st:kundeStats(k.id,y)}));
  const maxHon=Math.max(...rows.map(r=>r.st.hon),1);
  const withE=rows.filter(r=>r.st.n>0).sort((a,b)=>b.st.hon-a.st.hon);
  const noE=rows.filter(r=>r.st.n===0).sort((a,b)=>a.k.name.localeCompare(b.k.name,"de"));
  /* Anlegen gehoert nach OBEN: bei 20 Kunden scrollt man sonst ewig (Max, 01.08.2026). */
  h+=`<div class="kadd" id="addK">＋ Kunde anlegen</div>`;
  withE.forEach(({k,st})=>{
    const good=st.satz!=null&&st.satz>=jahresAvg;
    const dev=(st.satz!=null&&jahresAvg)?Math.round((st.satz/jahresAvg-1)*100):null;
    const ant=totHon?Math.round(st.hon/totHon*100):0;
    const note=dev==null?"":dev>=0?`Liegt ${dev} % über deinem Ø-Stundensatz.`:`Liegt ${Math.abs(dev)} % unter deinem Ø-Stundensatz – Tagessatz nachverhandeln.`;
    h+=`<div class="kcard" data-k="${k.id}">
      <div class="khead"><div><div class="kname">${esc(k.name)}</div><div class="ksub">${esc(subLine(k,st.n))}</div></div><span class="badge ${good?"green":"blue"} wide">${good?"HALTEN":"PRÜFEN"}</span></div>
      <div class="kpi"><div><span class="kl">Honorar</span><span class="kv">${eur(st.hon)}</span></div><div><span class="kl">Ø Satz${zbSuffix()}</span><span class="kv">${st.satz!=null?esc(fmtSatzBare(st.satz))+" €":"–"}</span></div><div><span class="kl">Anteil</span><span class="kv">${ant} %</span></div></div>
      <div class="kbar"><i class="${good?"pos":"info"}" style="width:${Math.min(100,st.hon/maxHon*100).toFixed(1)}%"></i></div>
      ${note?`<div class="knote">${esc(note)}</div>`:""}</div>`;});
  noE.forEach(({k})=>{
    h+=`<div class="kcard quiet" data-k="${k.id}"><div class="khead"><div><div class="kname">${esc(k.name)}</div><div class="ksub">${esc(subLine(k,0))}</div></div></div></div>`;});
  view.innerHTML=h;
  document.getElementById("addK").onclick=()=>editKunde(null);
  view.querySelectorAll("[data-k]").forEach(el=>el.onclick=()=>{state.detail=el.dataset.k;state.detailFrom="kunden";state.detailYear=null;window.scrollTo(0,0);render();});
  bindYear();
}

/* ===== Kunden-Detailseite (Beta 0.5) ===== */
function renderKundenDetail(){
  const kid=state.detail;const k=kunde(kid);
  if(!k){state.detail=null;return render();}
  {const _bs=document.getElementById("barsub");if(_bs)_bs.textContent=k.name;}
  const ys=years().filter(y=>DB.einsaetze.some(e=>e.kundeId===kid&&(e.datum||"").slice(0,4)===y));
  if(!state.detailYear||!ys.includes(state.detailYear))state.detailYear=ys[0]||years()[0];
  const y=state.detailYear;
  let h=`<div class="kd-top"><button class="kd-back" id="kdBack">‹ ${esc(k.name)}</button><button class="kd-edit" id="kdEdit">Bearbeiten</button></div>`;
  if(!ys.length){h+=`<div class="empty"><p>Noch keine Einsätze für diesen Kunden.</p></div>`;view.innerHTML=h;bindDetail(kid);return;}
  const cur=kundeStats(kid,y);const prev=kundeStats(kid,String(+y-1));
  const honAll=DB.einsaetze.filter(e=>e.kundeId===kid).reduce((a,e)=>a+(calcEinsatz(e,S).honorar||0),0);
  if(ys.length>1)h+=`<div class="yeartog" id="kdYear">${ys.map(yy=>`<button data-y="${esc(yy)}"${yy===y?' class="on"':''}>${esc(yy)}</button>`).join("")}</div>`;
  const overZiel=cur.satz!=null&&cur.satz>=S.zielStundensatz;
  const trend=(c,p)=>{if(p==null||p===0||c==null)return "";const d=(c-p)/p*100;const up=d>=0;return `<b class="${up?"up":"down"}">${up?"▲":"▼"} ${Math.abs(Math.round(d))} %</b>`;};
  const tS=trend(cur.satz,prev.satz),tH=trend(cur.hon,prev.hon);

  h+=`<div class="krow c2" style="margin-top:14px">
    <div class="kt"><div class="l">Umsatz ${esc(y)} · netto</div><div class="n">${eur(cur.hon)}</div></div>

  </div>
  <div class="kt" style="margin-bottom:12px"><div class="l">Offene Forderungen · brutto</div><div class="n blue">${eur(cur.offenBrutto)}</div></div>

    <div class="kt"><div class="l">Stunden ${esc(y)}</div><div class="n">${fmtStd(cur.std)}</div></div>

  const rated=DB.einsaetze.filter(e=>e.kundeId===kid&&[1,2,3].includes(e.stimmung)).sort((a,b)=>((a.datum||"")+(a.beginn||"")).localeCompare((b.datum||"")+(b.beginn||"")));
  let tend="";
  if(rated.length>=4){const avg=arr=>arr.reduce((a,e)=>a+e.stimmung,0)/arr.length;const d=avg(rated.slice(-3))-avg(rated.slice(0,-3));
    tend=d<=-0.3?'<span class="up">▲ zuletzt entspannter</span>':d>=0.3?'<span class="down">▼ zuletzt stressiger</span>':'<span style="color:var(--muted)">zuletzt stabil</span>';}
  h+=`<div class="secttl">Stimmung ${esc(y)}</div>

  if(cur.months.length){h+=`<div class="secttl">Umsatz pro Monat</div><div class="chartwrap">${colChartSVG(cur.months)}</div><div class="kd-legend"><span><i class="sw-pos"></i>bezahlt</span><span><i class="sw-info"></i>offen / gestellt</span></div>`;}
  view.innerHTML=h;bindDetail(kid);

function renderStats(){
  const ys=years();if(!state.year||!ys.includes(state.year))state.year=ys[0];
  const E=einsJahr(state.year);
  let h="";
  if(ys.length>1)h+=`<div class="yeartog" id="yearSel">${ys.map(y=>`<button data-y="${esc(y)}"${y===state.year?' class="on"':''}>${esc(y)}</button>`).join("")}</div>`;
  if(!E.length){view.innerHTML=h+`<div class="empty"><p>Keine Einsätze in ${esc(state.year)}.</p></div>`;bindYear();return;}
  const cs=E.map(e=>({e,c:calcEinsatz(e,S)}));
  const sum=k=>cs.reduce((a,x)=>a+(x.c[k]||0),0);
  const std=cs.reduce((a,x)=>a+(stdOf(x.c)||0),0),hon=sum("honorar"),vf=sum("verfuegbar"),ust=sum("ustRuecklage"),est=sum("steuerRuecklage");
  const ziel=S.jahresziel||0;const pct=ziel>0?Math.round(vf/ziel*100):0;const pw=ziel>0?Math.min(100,vf/ziel*100):0;
  /* Jahres-Hero */
  h+=`<div class="hero"><div class="lab">${esc(state.year)} · verfügbar nach Rücklagen</div><div class="big">${eur(vf)}</div>
    <div style="margin-top:2px">${ziel>0?`<span class="goalbadge">${pct} % vom Ziel</span><span class="goalziel">Ziel ${eur(ziel)}</span>`:""}</div>
    ${ziel>0?`<div class="progress"><i style="width:${pw.toFixed(1)}%"></i></div>`:""}</div>`;
  /* Kachelreihe A + B */
  h+=`<div class="krow c2" style="margin-top:14px">
    <div class="kt"><div class="l">Honorar netto</div><div class="n">${eur(hon)}</div><div class="sub">brutto ${eur(sum("rechnungsbetrag"))}</div></div>
    <div class="kt"><div class="l">Rücklage FA</div><div class="n blue">${eur(ust+est)}</div><div class="sub">USt ${eur(ust)} · ESt ${eur(est)}</div></div>
  </div>
  <div class="krow c3">
    <div class="kt"><div class="l">Einsätze</div><div class="n">${E.length}</div></div>
    <div class="kt"><div class="l">Stunden${zbSuffix()}</div><div class="n">${fmtStd(std)}</div></div>
    <div class="kt"><div class="l">Ø €/h${zbSuffix()}</div><div class="n">${fmtSatzBare(std?hon/std:null)}</div></div>
  </div>`;
  /* Offene Forderungen (Beta) */
  const offN=cs.filter(x=>x.e.status!=="bezahlt").length,offB=cs.filter(x=>x.e.status!=="bezahlt").reduce((a,x)=>a+(x.c.rechnungsbetrag||0),0);
  h+=`<div class="kt" style="margin-bottom:14px"><div class="l">Offene Forderungen · brutto · ${offN} offen</div><div class="n">${eur(offB)}</div></div>`;
  /* Budget 50/30/20 */
  h+=`<div class="budget">
    <div class="bh"><h4>Budget ${Math.round(S.splitFix*100)} / ${Math.round(S.splitPersoenlich*100)} / ${Math.round(S.splitSparen*100)}</h4><span>vom Verfügbaren</span></div>
    <div class="budgetrow"><span class="bl">Fixkosten</span><span class="bt"><i style="width:100%;background:var(--ink)"></i></span><span class="bv">${eur(sum("splitFix"))}</span></div>
    <div class="budgetrow"><span class="bl">Wünsche</span><span class="bt"><i style="width:60%;background:var(--ink-55)"></i></span><span class="bv">${eur(sum("splitPersoenlich"))}</span></div>
    <div class="budgetrow"><span class="bl">Rücklage</span><span class="bt"><i style="width:40%;background:var(--ink-35)"></i></span><span class="bv">${eur(sum("splitSparen"))}</span></div>
  </div>`;
  /* Aggregation je Kunde */
  const perK={};cs.forEach(({e,c})=>{const p=perK[e.kundeId]??={n:0,std:0,hon:0};p.n++;p.std+=stdOf(c)||0;p.hon+=c.honorar||0;});
  const rows=Object.entries(perK).map(([kid,p])=>({kid,...p,satz:p.std?p.hon/p.std:null}));
  const avg=std?hon/std:0;
  /* Kunden-Quadrant */
  if(rows.length>=2){
    const byHon=rows.slice().sort((a,b)=>(b.hon||0)-(a.hon||0));
    const worst=rows.slice().filter(r=>r.satz!=null).sort((a,b)=>(a.satz||0)-(b.satz||0))[0];
    const top=byHon[0];const topPct=hon?Math.round(top.hon/hon*100):0;
    const tip=(worst?`${esc(kName(worst.kid))} bringt Zeit für ${esc(fmtSatzH(worst.satz))} – nachverhandeln. `:"")+(top?`${esc(kName(top.kid))} trägt ${topPct} % des Honorars.`:"");
    const mehr=rows.length>6?` Beschriftet sind die 6 größten Kunden, die übrigen ${rows.length-6} sind als blasse Punkte eingezeichnet.`:"";
    h+=`<div class="qcard"><div class="qh"><h3>Kunden-Quadrant</h3><span>Umsatz × Stundensatz${zbSuffix()}</span></div>${quadrantSVG(rows,avg)}<p class="qhint">${tip}${mehr}</p></div>`;
  }
  /* Verdienst pro Kunde (antippbar → Detail) */
  const vsorted=rows.slice().sort((a,b)=>(b.hon||0)-(a.hon||0));const maxFee=Math.max(...vsorted.map(r=>r.hon||0),1);
  h+=`<div class="secttl">Verdienst pro Kunde</div><div class="vcard">`;
  vsorted.forEach(r=>{h+=`<div class="vrow" data-kdetail="${r.kid}"><div class="vt"><span>${esc(kName(r.kid))}</span><span class="amt">${eur(r.hon)}</span></div><div class="vb"><i style="width:${Math.min(100,(r.hon||0)/maxFee*100).toFixed(1)}%"></i></div></div>`;});
  h+=`</div>`;
  /* Pro Monat (Beta, colChart) */
  const pm={};cs.forEach(({e,c})=>{const mk=(e.datum||"").slice(0,7);const p=pm[mk]??={paid:0,open:0};if(e.status==="bezahlt")p.paid+=c.honorar||0;else p.open+=c.honorar||0;});
  const pmMonths=Object.keys(pm).sort().map(mk=>({mk,paid:pm[mk].paid,open:pm[mk].open}));
  h+=`<div class="secttl">Pro Monat</div><div class="chartwrap">${colChartSVG(pmMonths)}</div><div class="kd-legend"><span><i class="sw-pos"></i>bezahlt</span><span><i class="sw-info"></i>offen / gestellt</span></div>`;
  view.innerHTML=h;bindYear();
  view.querySelectorAll("[data-kdetail]").forEach(el=>el.onclick=()=>{state.detail=el.dataset.kdetail;state.detailFrom="stats";state.detailYear=null;window.scrollTo(0,0);render();});
}

  if(ysel)ysel.querySelectorAll("button").forEach(b=>b.onclick=()=>{state.year=b.dataset.y;render();});}

/* Live-Vorschau der Steuer-/Ziel-Einstellungen aufs gewählte Jahr. Summen über eur() (blurt). */
function impactText(y){
  const E=y?einsJahr(y):[];
  if(!E.length)return `<span class="imttl">Wirkung auf ${esc(y||"–")}</span><span class="imtx">Noch keine Einsätze in ${esc(y||"diesem Jahr")}.</span>`;
  let hon=0,ruck=0,vf=0;
  E.forEach(e=>{const c=calcEinsatz(e,S);hon+=c.honorar||0;ruck+=(c.ustRuecklage||0)+(c.steuerRuecklage||0);vf+=c.verfuegbar||0;});
  const pct=hon?Math.round(vf/hon*100):0;
  return `<span class="imttl">Wirkung auf ${esc(y)}</span><span class="imtx">Rücklage ${eur(ruck)} · verfügbar ${eur(vf)} (${pct} % vom Honorar).</span>`;
}

/* ===== Datensicherung ===== */
function dlBlob(blob,fname){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fname;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);toast("Datei gespeichert");}
function shareOrDl(blob,fname,mime){const file=new File([blob],fname,{type:mime});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).then(()=>toast("Geteilt")).catch(err=>{if(err&&err.name!=="AbortError")dlBlob(blob,fname);});
  }else dlBlob(blob,fname);}
function exportBackup(){
  const fname="Kontor-Backup_"+new Date().toISOString().slice(0,10)+".json";
  const blob=new Blob([JSON.stringify({app:"kontor",exportedAt:new Date().toISOString(),data:DB},null,1)],{type:"application/json"});
  const file=new File([blob],fname,{type:"application/json"});
  const mark=()=>{S.lastBackup=Date.now();persist();const lb=document.getElementById("lastBak");if(lb)lb.textContent=fmtDE(new Date(S.lastBackup));};
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).then(()=>{mark();toast("Backup geteilt");render();}).catch(err=>{if(err&&err.name!=="AbortError"){dlBlob(blob,fname);mark();render();}});
  }else{dlBlob(blob,fname);mark();render();}
}
document.getElementById("backupInput").addEventListener("change",e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const j=JSON.parse(r.result);
    const db=j&&j.app==="kontor"&&j.data&&Array.isArray(j.data.kunden)&&Array.isArray(j.data.einsaetze)?j.data:null;
    if(!db){toast("Keine gültige Kontor-Sicherungsdatei");return;}
    askConfirm("Backup mit "+db.einsaetze.length+" Einsätzen und "+db.kunden.length+" Kunden einlesen? Ersetzt den aktuellen Stand ("+DB.einsaetze.length+" Einsätze).",()=>{
      /* Die eingelesene Datei IST ein Backup: sonst mahnt der Banner direkt nach dem
         Wiederherstellen ein Backup an (exportBackup schreibt lastBackup erst nach dem Serialisieren). */
      DB=db;DB.settings??={};DB.settings.lastBackup??=Date.now();persist();location.reload();
    },"Einlesen");
  }catch(err){console.error(err);toast("Backup konnte nicht gelesen werden");}};
  r.readAsText(f);
});
/* ===== CSV-Export (für Steuerberater – OHNE Stimmung) ===== */
function csvEsc(s){s=String(s||"");return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function csvYear(y){
  const E=einsJahr(y).slice().sort((a,b)=>((a.datum||"")+(a.beginn||"")).localeCompare((b.datum||"")+(b.beginn||"")));
  if(!E.length){toast("Keine Einsätze in "+y);return;}
  const num=n=>n==null?"":n.toFixed(2).replace(".",",");
  const rows=[["Kunde","Datum","Beginn","Ende","Stunden","Modus","Satz (netto)","Honorar (netto)","Stundensatz","Rechnungsbetrag (brutto)",
    "USt-Rücklage ("+Math.round(S.mwst*100)+" %)","Steuer-Rücklage ("+Math.round(S.steuersatz*100)+" %)","Verfügbar",
    "Fixkosten ("+Math.round(S.splitFix*100)+" %)","Persönliches ("+Math.round(S.splitPersoenlich*100)+" %)","Sparen ("+Math.round(S.splitSparen*100)+" %)","Status",
    "Vorbereitung","Nachbereitung","Fahrt hin","Fahrt zurück","Arbeit gesamt","Tür zu Tür","Notiz"].join(";")];
  E.forEach(e=>{const c=calcEinsatz(e,S);
    rows.push([csvEsc(kName(e.kundeId)),fmtDE(new Date(e.datum+"T00:00")),e.beginn,e.ende,num(c.stunden),
      e.modus==="stunde"?"Stunde":"Tag",num(+e.tagessatz),num(c.honorar),
      num(c.stundensatz),num(c.rechnungsbetrag),num(c.ustRuecklage),num(c.steuerRuecklage),num(c.verfuegbar),
      num(c.splitFix),num(c.splitPersoenlich),num(c.splitSparen),csvEsc(e.status),
      num(e.vorbereitung||0),num(e.nachbereitung||0),num(e.fahrtHin||0),num(e.fahrtZurueck||0),num(c.arbeitStunden),num(c.stundenGesamt),csvEsc(e.notiz)].join(";"));});
  const blob=new Blob(["﻿"+rows.join("\r\n")],{type:"text/csv"});
  shareOrDl(blob,"Kontor_"+y+".csv","text/csv");
}

function openHelp(){
  openSheet(`<h3>Anleitung</h3><div class="help">
    <div class="hsec"><h4>📋 So ist Kontor aufgebaut</h4>
      <p>Du erfasst <b>Einsätze</b> für deine <b>Kunden</b> – Datum, Beginn, Ende, Tagessatz. Kontor rechnet daraus Stunden, Stundensatz und dein Geld.</p>
      <p>Menüs wie dieses schiebst du zum Schließen <b>nach unten</b> – oder du tippst „Abbrechen".</p>
      <p class="tip">Alle Daten bleiben nur auf diesem Gerät. Kein Server, kein Konto. Kontor rechnet für deine <b>selbstständige</b> Arbeit. Angestellten-Tätigkeit gehört nicht hierher, die läuft über die Lohnabrechnung.</p></div>
    <div class="hsec"><h4>⏱ Einsatz erfassen – 3 Tipps bis fertig</h4>
      <p>Kunden-Chip antippen (Tagessatz füllt sich selbst), Beginn und Ende wählen, speichern. Neue Kunden legst du mit <b>„＋ Neu"</b> direkt im Formular an.</p>
      <p><b>↻ Nochmal</b> an einem Einsatz übernimmt Kunde, Zeiten und Satz – nur das Datum steht auf heute. Endet ein Dreh nach Mitternacht (22:00–06:00), rechnet Kontor automatisch über 0:00 hinweg.</p>
      <p>Die <b>Stimmung</b> (🟢 · 😐 · 🔴) ist optional – am Jahresende siehst du pro Kunde, wie sich die Zusammenarbeit angefühlt hat.</p></div>
    <div class="hsec"><h4>💶 Wohin dein Geld fließt</h4>
      <p>Von deinem Honorar (netto) gehen zwei Rücklagen ab, die dir nie gehört haben:</p>
      <p><b>USt-Rücklage</b> · steht auf deiner Rechnung, gehört dem Finanzamt.<br><b>Steuer-Rücklage</b> (aufs Netto) · für Einkommensteuer und Abgaben.</p>
      <p>Was übrig bleibt, ist dein <b>Verfügbar</b> – darauf laufen die Splits (Fixkosten · Persönliches · Sparen).</p>
      <p class="tip">Kleinunternehmer nach §19 UStG? Dann steht dein USt-Satz auf 0 % (Einrichtung oder Einstellungen) und die USt-Rücklage entfällt komplett.</p>
      <p class="tip">Die Sätze stellst du in den Einstellungen ein (Regler für USt und Einkommensteuer-Rücklage). Den richtigen Steuersatz kennt dein Steuerberater – Kontor gibt keine Steuerberatung.</p></div>
    <div class="hsec"><h4>📊 Statistik lesen</h4>
      <p>Die Kundenliste sortiert nach <b>Ø-Stundensatz</b>: grün = über deinem Ziel, blau = darunter. Daneben stehen immer Einsätze, Stunden und Umsatzanteil – ein hoher Satz bei 6 Stunden im Jahr ist kein Top-Kunde.</p>
      <p>Der <b>Quadrant</b> zeigt vier Handlungen: Ausbauen, Mitnehmen, Preis erhöhen, Ziehen lassen. Die Schwellen stehen dabei – es ist ein Vergleich deiner Kunden untereinander, kein Urteil.</p></div>
    <div class="hsec"><h4>💾 Backup – wichtig!</h4>
      <ol><li>Einstellungen → <b>„Backup teilen"</b></li><li>In „Dateien"/Cloud sichern oder dir selbst mailen</li><li>Wiederherstellen mit <b>„Backup einlesen"</b></li></ol>
      <p class="tip">Deine Daten liegen nur im Browser dieses Geräts – iOS kann sie unter Speicherdruck löschen. Einlesen ersetzt den aktuellen Stand komplett.</p></div>
    <div class="hsec"><h4>📄 CSV für die Buchhaltung</h4>
      <p>Pro Jahr eine Datei mit allen Einsätzen und Beträgen – ohne Stimmung, die bleibt privat. Öffnet direkt in Numbers oder Excel.</p></div>
    <div class="hsec"><h4>📡 Offline &amp; Installation</h4>
      <p>Nach dem ersten Laden läuft Kontor auch ohne Internet. Installieren: in Safari öffnen → Teilen → <b>„Zum Home-Bildschirm"</b>.</p></div>
  </div>
  <button class="btn" id="helpClose">Schließen</button>`);
  document.getElementById("helpClose").onclick=closeSheet;
}

/* ===== Onboarding (Beta): 4 Vollbild-Karten beim ersten Start ===== */
function showOnboarding(){
  if(document.getElementById("onboard"))return;
  /* Frischer Start: Spec-Defaults (30 % / 100 €), nicht Max' Alt-Defaults aus der Migration.
     Wiederaufruf aus den Einstellungen: aktuelle Werte vorbelegen. */
  const w=S.onboarded
    ?{modus:S.defaultModus,mwst:(S.mwst>0?0.19:0),steuer:Math.round(S.steuersatz*100),ziel:S.zielStundensatz}
    :{modus:S.defaultModus,mwst:0.19,steuer:30,ziel:100};
  const el=document.createElement("div");el.className="onboard";el.id="onboard";document.body.appendChild(el);
  let step=0;
  const finish=()=>{
    S.defaultModus=w.modus;S.mwst=w.mwst;S.steuersatz=Math.min(60,Math.max(0,w.steuer))/100;
    S.zielStundensatz=Math.max(0,w.ziel)||0;S.onboarded=true;persist();el.remove();render();
  };
  const dots=()=>`<div class="odots">${[0,1,2,3].map(i=>`<span${i===step?' class="on"':''}></span>`).join("")}</div>`;
  const choice=(id,items,cur)=>`<div class="ochoice" id="${id}">${items.map(it=>`<button type="button" data-v="${it.v}"${String(cur)===String(it.v)?' class="on"':''}>${it.t}${it.s?`<small>${it.s}</small>`:""}</button>`).join("")}</div>`;
  function paint(){
    const steps=[
      `<h2>Kontor</h2><p>Erfasst deine Zeit und rechnet ehrlich aus, was dir davon bleibt: Rücklagen für Steuer und Umsatzsteuer, dein Verfügbares, dein Verdienst pro Kunde.</p><p class="onote">Deine Daten bleiben auf diesem Gerät. Kein Konto, kein Server.</p>`,
      `<h2>Wie rechnest du meistens ab?</h2>${choice("ob_modus",[{v:"tag",t:"Tagessatz",s:"Pauschale pro Einsatztag"},{v:"stunde",t:"Stundensatz",s:"Stunden mal Satz"}],w.modus)}<p class="onote">Gilt als Vorschlag für neue Kunden · pro Kunde und Einsatz änderbar.</p>`,
      `<h2>Weist du Umsatzsteuer aus?</h2>${choice("ob_ust",[{v:"0.19",t:"Ja, 19 %",s:"Kontor legt sie automatisch beiseite – sie gehört dem Finanzamt"},{v:"0",t:"Nein, Kleinunternehmer (§19 UStG)",s:"Keine USt auf deinen Rechnungen"}],w.mwst)}`,
      `<h2>Rücklagen &amp; Ziel</h2>
       <div class="field"><label>Steuer-Rücklage (% vom Honorar)</label><input type="number" id="ob_steuer" min="0" max="60" value="${esc(w.steuer)}"><p class="note">Näherung für Einkommensteuer und Abgaben – den echten Wert kennt dein Steuerberater. Keine Steuerberatung.</p></div>
       <div class="field"><label>Ziel-Stundensatz (€, optional)</label><input type="number" id="ob_ziel" min="0" step="5" value="${esc(w.ziel)}"><p class="note">Färbt später die Kundenliste: grün über Ziel, blau darunter.</p></div>
       <p class="onote">Vom Verfügbaren teilt Kontor 50 % Fixkosten · 30 % Persönliches · 20 % Sparen auf – änderbar in den Einstellungen.</p>`
    ];
    el.innerHTML=`<div class="oin">${step>0?'<button class="oskip" id="obSkip">Überspringen</button>':'<div class="oskip"></div>'}
      <div class="obody">${steps[step]}</div>${dots()}
      <button class="btn" id="obNext">${step===3?"Los geht's":"Weiter"}</button></div>`;
    const sk=document.getElementById("obSkip");if(sk)sk.onclick=finish;
    const bindChoice=(id,fn)=>{const c=document.getElementById(id);if(c)c.querySelectorAll("button").forEach(b=>b.onclick=()=>{fn(b.dataset.v);c.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));});};
    bindChoice("ob_modus",v=>{w.modus=(v==="stunde")?"stunde":"tag";});
    bindChoice("ob_ust",v=>{w.mwst=parseFloat(v)||0;});
    document.getElementById("obNext").onclick=()=>{
      if(step===3){w.steuer=parseInt(val("ob_steuer"));if(!Number.isFinite(w.steuer))w.steuer=30;
        w.ziel=parseFloat(val("ob_ziel"));if(!Number.isFinite(w.ziel))w.ziel=100;finish();return;}
      step++;paint();};
  }
  paint();
}

/* ===== Sheet ===== */
const scrim=document.getElementById("scrim"),sheet=document.getElementById("sheet");
let shT=null;
function openSheet(html){clearTimeout(shT);scrim.classList.remove("out");sheet.classList.remove("out");sheet.innerHTML='<div class="grip"></div>'+html;scrim.classList.add("on");sheet.scrollTop=0;}
function closeSheet(){
  if(!scrim.classList.contains("on")||scrim.classList.contains("out"))return;
  scrim.classList.add("out");
  if(!sheet.style.transform)sheet.classList.add("out");/* Swipe hat das Sheet schon rausgeschoben */
  shT=setTimeout(()=>{scrim.classList.remove("on","out");sheet.classList.remove("out");sheet.style.transform="";sheet.style.transition="";},200);
}
scrim.addEventListener("click",e=>{if(e.target===scrim)closeSheet();});
/* Wisch nach unten schließt das Sheet (nur wenn der Inhalt oben steht) */
let swY=null,swActive=false;
sheet.addEventListener("touchstart",e=>{swY=e.touches[0].clientY;swActive=sheet.scrollTop<=0;},{passive:true});
sheet.addEventListener("touchmove",e=>{
  if(swY==null||!swActive)return;
  const dy=e.touches[0].clientY-swY;
  if(dy>0&&sheet.scrollTop<=0){sheet.style.transition="none";sheet.style.transform="translateY("+dy+"px)";e.preventDefault();}
},{passive:false});
sheet.addEventListener("touchend",e=>{
  if(swY==null)return;
  const dy=e.changedTouches[0].clientY-swY;swY=null;
  if(swActive&&dy>110){sheet.style.transition="transform .22s ease";sheet.style.transform="translateY(100%)";setTimeout(closeSheet,210);}
  else{sheet.style.transition="transform .22s ease";sheet.style.transform="";setTimeout(()=>{sheet.style.transition="";},240);}
  swActive=false;
});

/* ===== Utils ===== */
function val(id){return (document.getElementById(id)||{}).value||"";}
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
let toastT;function toast(m){const el=document.getElementById("toast");el.textContent=m;el.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("on"),2600);}
/* soft=true: nicht-destruktive Frage, der Ja-Knopf bleibt neutral statt rot. */
function askConfirm(msg,onYes,yesLabel,soft){const el=document.getElementById("confirmBox");el.querySelector(".cmsg").textContent=msg;el.classList.remove("out");el.classList.add("on");const yes=document.getElementById("cYes"),no=document.getElementById("cNo");yes.textContent=yesLabel||"Löschen";yes.classList.toggle("danger",!soft);const close=()=>{el.classList.add("out");setTimeout(()=>{el.classList.remove("on","out");},150);yes.onclick=null;no.onclick=null;};yes.onclick=()=>{close();onYes();};no.onclick=close;}
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))navigator.serviceWorker.register("sw.js").catch(()=>{});
applyTheme();
measureBar();
render();
if(!S.onboarded&&!DB.kunden.length&&!DB.einsaetze.length)showOnboarding();
</script>
